name = "WebMix"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["WebMix"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false          # a typo must be an error, not a new universally quantified variable
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "WebMix"
